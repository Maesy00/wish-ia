<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wish.ia</title>
  <meta name="description" content="L'inventaire de mes envies, liste par liste.">
  <meta name="theme-color" content="#fafaf8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-gate" hidden>
    <main class="auth-card">
      <p class="kicker">Wish.ia</p>
      <h1 class="display">Mes <em>envies</em></h1>
      <p class="auth-subtitle">Connecte-toi avec le même compte que Coach.ia et Brain.ia.</p>
      <form id="auth-form">
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" id="auth-email" required autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">Mot de passe</span>
          <input class="input" type="password" id="auth-password" required autocomplete="current-password" minlength="6">
        </label>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Se connecter</button>
      </form>
    </main>
  </div>

  <div id="app-shell" hidden>
    <!-- Page provisoire : l'inventaire arrive à l'étape 4. -->
    <main class="page">
      <p class="kicker" id="inventory-kicker">Inventaire</p>
      <h1 class="display">Mes <em>envies</em></h1>
      <hr class="rule">
      <p class="muted">Connecté : <span id="account-email"></span></p>
      <button type="button" class="link-btn" id="sign-out-btn">Se déconnecter</button>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
