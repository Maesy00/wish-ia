<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wish.ia</title>
  <meta name="description" content="L'inventaire de mes envies, liste par liste.">
  <meta name="theme-color" content="#fafaf8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wish.ia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-gate" hidden>
    <main class="auth-card">
      <p class="kicker">Wish.ia</p>
      <h1 class="display">Mes <em>envies</em></h1>
      <p class="auth-subtitle">Connecte-toi avec le même compte que Coach.ia et Brain.ia.</p>
      <form id="auth-form">
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" id="auth-email" required autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">Mot de passe</span>
          <input class="input" type="password" id="auth-password" required autocomplete="current-password" minlength="6">
        </label>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Se connecter</button>
      </form>
    </main>
  </div>

  <div id="app-shell" hidden>
    <div class="page">
      <header class="masthead">
        <div>
          <p class="kicker" id="inventory-kicker">Inventaire</p>
          <h1 class="display">Mes <em>envies</em></h1>
        </div>
        <button type="button" class="btn btn-primary add-btn" id="add-item-btn" aria-label="Ajouter un objet"><span aria-hidden="true">+</span></button>
      </header>

      <nav class="tabs" id="list-tabs" aria-label="Filtrer par liste"></nav>

      <div class="toolbar">
        <label class="toolbar-search">
          <span class="visually-hidden">Rechercher un objet par son nom</span>
          <input class="input" type="search" id="search-input" placeholder="Rechercher" autocomplete="off">
        </label>
        <label class="toolbar-sort">
          <span class="toolbar-label">Trier par</span>
          <select class="input" id="sort-select">
            <option value="recent">Date d'ajout</option>
            <option value="priceAsc">Prix croissant</option>
            <option value="priceDesc">Prix décroissant</option>
            <option value="name">Nom</option>
          </select>
        </label>
        <button type="button" class="link-btn" id="manage-lists-btn">Gérer les listes</button>
      </div>

      <div class="layout">
        <main class="inventory" aria-label="Inventaire">
          <div class="row-head" id="inventory-head" aria-hidden="true">
            <span></span><span>Objet</span><span>Liste</span><span>Ajouté le</span><span class="is-right">Prix</span><span class="is-right">Lien</span>
          </div>
          <ul class="rows" id="inventory-rows"></ul>
          <div class="empty" id="inventory-empty" hidden></div>
        </main>
        <aside class="detail" id="detail" aria-label="Fiche de l'objet">
          <p class="muted">Sélectionne un objet pour voir sa fiche.</p>
        </aside>
      </div>

      <footer class="footer">
        <span id="account-email"></span>
        <span class="footer-actions">
          <button type="button" class="link-btn" id="export-btn">Exporter mes données</button>
          <button type="button" class="link-btn" id="sign-out-btn">Se déconnecter</button>
        </span>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/sheet.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/images.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/lists.js"></script>
  <script src="js/modules/item.js"></script>
  <script src="js/modules/item-form.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
